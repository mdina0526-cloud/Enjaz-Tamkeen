services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - private
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      Database__Provider: PostgreSql
      ConnectionStrings__Default: Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Jwt__Key: ${JWT_KEY}
      Seed__AdminPassword: ${ADMIN_INITIAL_PASSWORD}
      App__CorsOrigins__0: https://${SITE_DOMAIN}
      App__TrustedProxyIp: 172.30.91.2
      Storage__UploadsPath: /app/App_Data/uploads
    volumes:
      - uploads:/app/App_Data/uploads
      - data_protection_keys:/app/App_Data/keys
    networks:
      - private
      - edge
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health/ready"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    networks:
      edge:
        ipv4_address: 172.30.91.2
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  uploads:
  data_protection_keys:
  caddy_data:
  caddy_config:

networks:
  private:
    internal: true
  edge:
    ipam:
      config:
        - subnet: 172.30.91.0/24
